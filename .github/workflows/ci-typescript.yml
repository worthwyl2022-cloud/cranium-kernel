name: Cranium TypeScript CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Synapse integration check
        run: npm run verify:synapse
      - name: Miracle Memory check
        run: npx tsx scripts/miracle-memory-check.ts
      - name: Atomic recovery check
        run: npx tsx scripts/atomic-recovery-check.ts
